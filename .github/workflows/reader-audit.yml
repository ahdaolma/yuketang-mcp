name: Reader navigation investigation
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level
        type: choice
        default: '35'
        options: ['26', '29', '35']
      suite:
        description: Reader, isolated paper or hardware editor checks
        type: choice
        default: reader
        options: [reader, paper, editor, echo, boundary, storage, modes, resize]
permissions:
  contents: read
concurrency:
  group: reader-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build investigation target
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce actual reader navigation
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RAIN_READER_SUITE: ${{ inputs.suite || 'reader' }}
        with:
          api-level: ${{ inputs.api_level || '35' }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          script: cd android && bash scripts/reader_audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-audit-evidence
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/reader-audit-ui/
