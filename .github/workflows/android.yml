name: Android verification
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore fixed release identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_SIGNING }}
        run: |
          if [ -n "$ANDROID_RELEASE_SIGNING" ]; then
            python3 android/scripts/prepare_signing.py
          else
            echo '::notice::Fixed release signing is not configured. Tests will run; no installable release will be published.'
          fi
      - name: Test and build internal debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Audit release sources with Android Lint
        working-directory: android
        run: gradle --no-daemon lintRelease
      - name: Build and verify fixed-signature release
        if: env.RAIN_SIGNING_CONFIGURED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
          python3 scripts/verify_signing.py
          mkdir -p app/build/outputs/apk/baseline
          curl --fail --location --retry 3 --output app/build/outputs/apk/baseline/rain-study-1.0.0.apk https://github.com/ahdaolma/yuketang-mcp/releases/download/v1.0.0/rain-study-1.0.0.apk
          echo 'd926af914c840cddd1398e6db545c7bd3188889724b357ef988d61df4059f03d  app/build/outputs/apk/baseline/rain-study-1.0.0.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify APK launch and screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: cd android && RAIN_SMOKE_APK=app/build/outputs/apk/debug/app-debug.apk RAIN_VERIFY_RELEASE_UPDATE=1 RAIN_UPDATE_BASELINE_APK=app/build/outputs/apk/baseline/rain-study-1.0.0.apk RAIN_UPDATE_EXPECTED_VERSION=1.0.1 python3 scripts/verify_device.py
      - name: Publish verified fixed-signature APK
        if: env.RAIN_SIGNING_CONFIGURED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: study-bridge-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-release.*
            android/app/build/outputs/androidTest-results/
            android/smoke-artifacts/
            android/ui-review-artifacts/
            android/signing-artifacts/
          if-no-files-found: ignore
